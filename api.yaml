apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-deployment
  namespace: parcial2-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-rest
  template:
    metadata:
      labels:
        app: api-rest
    spec:
      containers:
      - name: api
        image: stefanprodan/podinfo:6.4.0
        ports:
        - containerPort: 9898
        env:
        - name: DB_HOST
          value: "db-service.parcial2-app.svc.cluster.local"
        - name: DB_PORT
          value: "5432"
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: db-secret
              key: POSTGRES_USER
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-secret
              key: POSTGRES_PASSWORD
        readinessProbe:
          httpGet:
            path: /readyz
            port: 9898
          initialDelaySeconds: 5
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /healthz
            port: 9898
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: api-service
  namespace: parcial2-app
spec:
  type: LoadBalancer
  selector:
    app: api-rest
  ports:
  - port: 80
    targetPort: 9898