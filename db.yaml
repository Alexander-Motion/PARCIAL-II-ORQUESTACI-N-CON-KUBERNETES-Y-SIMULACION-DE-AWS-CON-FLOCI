apiVersion: v1
kind: Secret
metadata:
  name: db-secret
  namespace: parcial2-app
type: Opaque
stringData:
  POSTGRES_USER: admin
  POSTGRES_PASSWORD: SecretPassword123
  POSTGRES_DB: appdb
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-deployment
  namespace: parcial2-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:15-alpine
        ports:
        - containerPort: 5432
        envFrom:
        - secretRef:
            name: db-secret
---
apiVersion: v1
kind: Service
metadata:
  name: db-service
  namespace: parcial2-app
spec:
  selector:
    app: postgres
  ports:
  - port: 5432
    targetPort: 5432